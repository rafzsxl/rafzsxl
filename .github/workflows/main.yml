name: generate arcade contribution graphs

on:
  schedule: # roda automaticamente a cada 24 horas
    - cron: "0 0 * * *"
  workflow_dispatch: # permite rodar manualmente
  push: # roda a cada push na branch main
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate contribution graphs
        run: |
          mkdir -p dist
          npx pacman-contribution-graph --game pacman --platform github --username rafzsxl --gametheme github-dark --output dist/pacman-contribution-graph-dark.svg

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
