- name: Generate contribution graphs
  run: |
    mkdir -p dist
    npx pacman-contribution-graph \
      --game pacman \
      --platform github \
      --username rafzsxl \
      --gametheme github-dark \
      --output dist/pacman-contribution-graph-dark.svg

- name: Add black background to SVG
  run: |
    node -e "
      const fs = require('fs');
      const path = 'dist/pacman-contribution-graph-dark.svg';
      let svg = fs.readFileSync(path, 'utf8');
      svg = svg.replace(
        /(<svg[^>]*>)/,
        '\\$1<rect width=\"100%\" height=\"100%\" fill=\"#000000\"/>'
      );
      fs.writeFileSync(path, svg);
    "

- name: Push SVGs to the output branch
  uses: crazy-max/ghaction-github-pages@v4
  with:
    target_branch: output
    build_dir: dist
  env:
    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
